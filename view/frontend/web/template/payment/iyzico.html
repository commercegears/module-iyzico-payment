<!--
/**
 * CommerceGears_IyzicoPayment checkout renderer.
 */
-->
<div class="payment-method commercegears-iyzico" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()"/>
        <label class="label" data-bind="attr: {'for': getCode()}">
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>
    <div class="payment-method-content">
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="commercegears-iyzico-note">
            <img class="commercegears-iyzico-logos" data-bind="attr: {src: getLogoUrl()}" alt="iyzico ile Öde, Mastercard, Visa, American Express, Troy" width="300" height="22" loading="lazy"/>
            <p data-bind="i18n: 'After you place the order you will pay securely on iyzico\'s payment form. Installment options are shown there for eligible cards.'"></p>
            <!-- ko if: isSandbox() -->
            <p class="commercegears-iyzico-sandbox" data-bind="i18n: 'Test mode: no real payment is taken.'"></p>
            <!-- /ko -->
        </div>
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout"
                        type="submit"
                        data-bind="click: placeOrder, attr: {title: $t('Continue to Payment')}, enable: (getCode() == isChecked()), css: {disabled: !isPlaceOrderActionAllowed()}"
                        disabled>
                    <span data-bind="i18n: 'Continue to Payment'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
